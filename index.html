<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PvP Рулетка</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        
        body {
            background: #0a0e17;
            color: white;
            min-height: 100vh;
            padding-bottom: 70px;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: #151e2a;
            border-bottom: 1px solid #2a3440;
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff6b6b, #4ecdc4);
        }
        
        .username {
            font-weight: 600;
        }
        
        .balance {
            background: rgba(255,215,0,0.15);
            padding: 8px 15px;
            border-radius: 20px;
            border: 1px solid gold;
            color: gold;
        }
        
        .container {
            padding: 15px;
        }
        
        /* Рулетка */
        .roulette-wrapper {
            background: #151e2a;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            position: relative;
        }
        
        .wheel-container {
            width: 280px;
            height: 280px;
            margin: 0 auto 20px;
            position: relative;
        }
        
        .arrow {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 30px solid gold;
            z-index: 20;
            filter: drop-shadow(0 0 5px gold);
        }
        
        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(
                #4CAF50 0deg 90deg,
                #2196F3 90deg 180deg,
                #9C27B0 180deg 270deg,
                #f44336 270deg 360deg
            );
            border: 4px solid gold;
            box-shadow: 0 0 20px rgba(255,215,0,0.3);
            transition: transform 3s cubic-bezier(0.25, 0.1, 0.15, 1);
            position: relative;
            overflow: hidden;
        }
        
        .wheel::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            background: gold;
            border-radius: 50%;
            border: 3px solid white;
        }
        
        /* Панель ставок */
        .bets-panel {
            background: #1f2a36;
            border-radius: 15px;
            padding: 15px;
            margin: 20px 0;
        }
        
        .timer {
            text-align: center;
            font-size: 48px;
            font-weight: 700;
            color: gold;
            margin: 10px 0;
            text-shadow: 0 0 10px rgba(255,215,0,0.5);
        }
        
        .players-list {
            margin: 15px 0;
            max-height: 200px;
            overflow-y: auto;
        }
        
        .player-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: #2a3440;
            border-radius: 10px;
            margin-bottom: 8px;
        }
        
        .player-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .player-avatar-small {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: linear-gradient(135deg, #45aaf2, #2d98da);
        }
        
        .bet-amount {
            color: #45aaf2;
            font-weight: 600;
        }
        
        .bet-controls {
            display: flex;
            gap: 10px;
            margin: 15px 0;
        }
        
        .bet-input {
            flex: 1;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid gold;
            background: #1f2a36;
            color: white;
            font-size: 16px;
        }
        
        .bet-btn {
            padding: 15px 25px;
            background: gold;
            color: #0a0e17;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
        }
        
        .spin-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 18px;
            cursor: pointer;
            margin: 10px 0;
        }
        
        .spin-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .result {
            text-align: center;
            padding: 15px;
            background: #1f2a36;
            border-radius: 10px;
            margin-top: 15px;
            font-size: 18px;
        }
        
        .winner {
            color: gold;
            font-weight: 700;
        }
        
        /* Нижнее меню */
        .bottom-menu {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-around;
            padding: 12px;
            background: #151e2a;
            border-top: 1px solid #2a3440;
        }
        
        .menu-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            color: #888;
            font-size: 12px;
            cursor: pointer;
        }
        
        .menu-item.active {
            color: gold;
        }
        
        .menu-icon {
            font-size: 22px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="user-info">
            <div class="avatar"></div>
            <span class="username" id="username">@klrpl</span>
        </div>
        <div class="balance" id="balance">1000 💰</div>
    </div>
    
    <div class="container">
        <div class="roulette-wrapper">
            <!-- Рулетка со стрелкой -->
            <div class="wheel-container">
                <div class="arrow"></div>
                <div class="wheel" id="wheel"></div>
            </div>
            
            <!-- Таймер -->
            <div class="timer" id="timer">10</div>
            
            <!-- Панель ставок -->
            <div class="bets-panel">
                <div style="margin-bottom: 10px; color: gold;">👥 Игроки:</div>
                <div class="players-list" id="playersList">
                    <!-- Список игроков будет тут -->
                </div>
                
                <!-- Ввод ставки -->
                <div class="bet-controls">
                    <input type="number" id="betAmount" class="bet-input" value="10" min="1">
                    <button class="bet-btn" onclick="placeBet()">💰 Сделать ставку</button>
                </div>
            </div>
            
            <!-- Кнопка запуска -->
            <button class="spin-btn" id="spinBtn" onclick="startRoulette()" disabled>🎲 Ожидание игроков (нужно 2+)</button>
            
            <!-- Результат -->
            <div class="result" id="result">
                ⏳ Сделайте ставку!
            </div>
        </div>
    </div>
    
    <!-- Нижнее меню -->
    <div class="bottom-menu">
        <div class="menu-item active">🎮 Игры</div>
        <div class="menu-item">🎡 Рулетка</div>
        <div class="menu-item">🎁 Розыгрыши</div>
        <div class="menu-item">👤 Профиль</div>
    </div>
    
    <script>
        // Telegram WebApp
        let tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        
        // Данные
        let balance = 1000;
        let players = [];
        let timerInterval = null;
        let timeLeft = 10;
        let isSpinning = false;
        
        // Получаем пользователя
        let user = tg.initDataUnsafe?.user;
        let currentUser = '@' + (user?.username || user?.first_name || 'klrpl');
        document.getElementById('username').textContent = currentUser;
        
        // Обновление списка игроков
        function updatePlayersList() {
            let list = document.getElementById('playersList');
            if(players.length === 0) {
                list.innerHTML = '<div style="text-align: center; padding: 20px; color: #888;">👥 Нет игроков</div>';
                return;
            }
            
            let html = '';
            players.forEach(p => {
                html += `
                    <div class="player-item">
                        <div class="player-info">
                            <div class="player-avatar-small"></div>
                            <div>
                                <div>${p.name}</div>
                                <div style="font-size: 12px; color: #888;">ставка</div>
                            </div>
                        </div>
                        <div class="bet-amount">${p.bet} 💰</div>
                    </div>
                `;
            });
            list.innerHTML = html;
            
            // Обновляем кнопку
            let spinBtn = document.getElementById('spinBtn');
            if(players.length >= 2) {
                spinBtn.disabled = false;
                spinBtn.textContent = '🎲 ЗАПУСТИТЬ РУЛЕТКУ';
            } else {
                spinBtn.disabled = true;
                spinBtn.textContent = `🎲 Ожидание игроков (нужно ${2 - players.length})`;
            }
        }
        
        // Сделать ставку
        function placeBet() {
            let bet = parseInt(document.getElementById('betAmount').value);
            
            if(bet > balance) {
                alert('Недостаточно средств!');
                return;
            }
            
            // Проверяем, есть ли уже игрок
            let existingPlayer = players.find(p => p.name === currentUser);
            if(existingPlayer) {
                alert('Вы уже сделали ставку!');
                return;
            }
            
            // Добавляем игрока
            players.push({
                name: currentUser,
                bet: bet
            });
            
            balance -= bet;
            document.getElementById('balance').innerHTML = balance + ' 💰';
            
            // Обновляем список
            updatePlayersList();
            
            // Сбрасываем таймер
            resetTimer();
            
            tg.HapticFeedback.impactOccurred('medium');
        }
        
        // Таймер
        function startTimer() {
            timeLeft = 10;
            document.getElementById('timer').innerHTML = timeLeft;
            
            if(timerInterval) clearInterval(timerInterval);
            
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').innerHTML = timeLeft;
                
                if(timeLeft <= 0) {
                    clearInterval(timerInterval);
                    if(players.length >= 2 && !isSpinning) {
                        startRoulette();
                    }
                }
            }, 1000);
        }
        
        function resetTimer() {
            timeLeft = 10;
            document.getElementById('timer').innerHTML = timeLeft;
            if(timerInterval) {
                clearInterval(timerInterval);
                startTimer();
            }
        }
        
        // Запуск рулетки
        function startRoulette() {
            if(players.length < 2) {
                alert('Нужно минимум 2 игрока!');
                return;
            }
            
            isSpinning = true;
            clearInterval(timerInterval);
            
            // Выбираем победителя
            let totalBet = players.reduce((sum, p) => sum + p.bet, 0);
            let random = Math.random() * totalBet;
            let cumulative = 0;
            let winner = null;
            
            for(let player of players) {
                cumulative += player.bet;
                if(random <= cumulative) {
                    winner = player;
                    break;
                }
            }
            
            // Анимация колеса
            let wheel = document.getElementById('wheel');
            let spins = 5 + Math.random() * 5;
            let degrees = spins * 360 + (Math.random() * 360);
            wheel.style.transform = `rotate(${degrees}deg)`;
            
            // Показываем результат через 3 секунды
            setTimeout(() => {
                winner.bet = totalBet; // Победитель получает всё
                document.getElementById('result').innerHTML = `
                    🎉 ПОБЕДИТЕЛЬ: <span class="winner">${winner.name}</span><br>
                    Выигрыш: ${totalBet} 💰
                `;
                
                // Если победитель - текущий пользователь
                if(winner.name === currentUser) {
                    balance += totalBet;
                    document.getElementById('balance').innerHTML = balance + ' 💰';
                    tg.HapticFeedback.notificationOccurred('success');
                } else {
                    tg.HapticFeedback.notificationOccurred('error');
                }
                
                // Очищаем игроков
                players = [];
                updatePlayersList();
                isSpinning = false;
                
                // Сбрасываем колесо
                setTimeout(() => {
                    wheel.style.transform = 'rotate(0deg)';
                }, 1000);
                
            }, 3000);
        }
        
        // Инициализация
        updatePlayersList();
        startTimer();
    </script>
</body>
</html>
