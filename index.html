<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>roulette</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0B0E14;
            color: #FFFFFF;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            padding: 20px;
            padding-bottom: 90px;
            position: relative;
        }

        /* Тонкий градиент */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 50% 50%, rgba(255,215,0,0.02), transparent 70%);
            pointer-events: none;
        }

        /* Время */
        .time {
            font-size: 14px;
            color: rgba(255,255,255,0.3);
            letter-spacing: 0.5px;
            margin-bottom: 30px;
            font-weight: 300;
        }

        /* Основной контент */
        .content {
            max-width: 380px;
            margin: 0 auto;
        }

        /* Заголовок рулетки */
        .roulette-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 25px;
            padding: 0 5px;
        }

        .roulette-title {
            font-size: 13px;
            font-weight: 400;
            color: rgba(255,255,255,0.4);
            letter-spacing: 0.8px;
            text-transform: uppercase;
        }

        .roulette-total {
            font-size: 24px;
            font-weight: 300;
            color: #FFD700;
            letter-spacing: -0.5px;
        }

        .roulette-total span {
            font-size: 13px;
            color: rgba(255,255,255,0.3);
            margin-left: 4px;
        }

        /* Колесо */
        .wheel-wrapper {
            position: relative;
            width: 280px;
            height: 280px;
            margin: 10px auto 35px;
        }

        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: #151A24;
            transition: transform 3.5s cubic-bezier(0.23, 1, 0.32, 1);
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .wheel.has-players {
            background: conic-gradient(
                #E54B4B 0deg,
                #4A90E2 120deg,
                #F9C80E 240deg,
                #E54B4B 360deg
            );
        }

        .arrow {
            position: absolute;
            top: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-top: 24px solid rgba(255,255,255,0.8);
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
            z-index: 10;
        }

        .wheel-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 44px;
            height: 44px;
            background: #0B0E14;
            border-radius: 50%;
            border: 1px solid rgba(255,215,0,0.2);
            z-index: 15;
        }

        /* Список игроков */
        .players-section {
            background: rgba(20, 25, 35, 0.6);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 18px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.03);
        }

        .players-header {
            display: flex;
            justify-content: space-between;
            color: rgba(255,255,255,0.25);
            font-size: 11px;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            padding: 0 4px;
        }

        .player-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }

        .player-item:last-child {
            border-bottom: none;
        }

        .player-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .player-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
        }

        .dot-red { background: #E54B4B; }
        .dot-blue { background: #4A90E2; }
        .dot-yellow { background: #F9C80E; }

        .player-name {
            font-size: 14px;
            font-weight: 400;
            color: rgba(255,255,255,0.8);
        }

        .player-bet {
            font-size: 14px;
            font-weight: 400;
            color: #FFD700;
        }

        .player-bet span {
            color: rgba(255,255,255,0.3);
            font-size: 11px;
            margin-left: 4px;
        }

        .empty-players {
            text-align: center;
            padding: 30px;
            color: rgba(255,255,255,0.2);
            font-size: 13px;
            font-weight: 300;
            letter-spacing: 0.3px;
        }

        /* Панель ставки */
        .stake-panel {
            background: rgba(20, 25, 35, 0.6);
            backdrop-filter: blur(10px);
            border-radius: 28px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.03);
        }

        .stake-label {
            color: rgba(255,255,255,0.3);
            font-size: 11px;
            letter-spacing: 0.5px;
            margin-bottom: 15px;
        }

        .stake-input-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
            padding: 0 4px;
        }

        .stake-input {
            flex: 1;
            background: transparent;
            border: none;
            color: #FFFFFF;
            font-size: 36px;
            font-weight: 300;
            letter-spacing: -1px;
            padding: 0;
        }

        .stake-input:focus {
            outline: none;
        }

        .stake-input::placeholder {
            color: rgba(255,255,255,0.1);
        }

        .stake-currency {
            font-size: 16px;
            font-weight: 300;
            color: rgba(255,255,255,0.3);
        }

        .stake-presets {
            display: flex;
            gap: 8px;
            margin-bottom: 25px;
        }

        .stake-preset {
            flex: 1;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.03);
            border-radius: 40px;
            padding: 10px;
            color: rgba(255,255,255,0.5);
            font-size: 13px;
            font-weight: 300;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .stake-preset:hover {
            background: rgba(255,215,0,0.05);
            border-color: rgba(255,215,0,0.2);
            color: #FFD700;
        }

        .stake-button {
            width: 100%;
            background: transparent;
            border: 1px solid rgba(255,215,0,0.3);
            border-radius: 40px;
            padding: 16px;
            color: #FFD700;
            font-size: 14px;
            font-weight: 400;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
        }

        .stake-button:hover {
            background: rgba(255,215,0,0.05);
            border-color: #FFD700;
        }

        .stake-button:active {
            transform: scale(0.98);
        }

        /* Нижнее меню */
        .bottom-menu {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-around;
            padding: 20px 30px 30px;
            background: linear-gradient(to top, #0B0E14, transparent);
        }

        .menu-item {
            color: rgba(255,255,255,0.2);
            font-size: 12px;
            font-weight: 300;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .menu-item.active {
            color: #FFD700;
        }

        /* Профиль */
        .profile-card {
            background: rgba(20, 25, 35, 0.6);
            backdrop-filter: blur(10px);
            border-radius: 28px;
            padding: 28px;
            border: 1px solid rgba(255,255,255,0.03);
        }

        .profile-name {
            font-size: 20px;
            font-weight: 300;
            margin-bottom: 20px;
            color: #FFFFFF;
        }

        .profile-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }

        .profile-row:last-child {
            border-bottom: none;
        }

        .profile-label {
            color: rgba(255,255,255,0.4);
            font-size: 13px;
            font-weight: 300;
        }

        .profile-value {
            color: #FFD700;
            font-size: 16px;
            font-weight: 300;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            font-size: 13px;
            font-weight: 300;
        }

        .history-time {
            color: rgba(255,255,255,0.3);
        }

        .history-winner {
            color: #FFD700;
        }

        .history-amount {
            color: rgba(255,255,255,0.5);
        }

        /* Секции */
        .section {
            display: none;
        }

        .section.active {
            display: block;
        }
    </style>
</head>
<body>
    <!-- Тонкое время -->
    <div class="time" id="currentTime"></div>

    <div class="content">
        <!-- Секция Рулетка -->
        <div id="rouletteSection" class="section active">
            <!-- Заголовок с суммой -->
            <div class="roulette-header">
                <span class="roulette-title">PVP РУЛЕТКА</span>
                <span class="roulette-total" id="totalBet">0 <span>TON</span></span>
            </div>

            <!-- Колесо -->
            <div class="wheel-wrapper">
                <div class="arrow"></div>
                <div class="wheel" id="wheel"></div>
                <div class="wheel-center"></div>
            </div>

            <!-- Игроки -->
            <div class="players-section">
                <div class="players-header">
                    <span>ИГРОКИ</span>
                    <span>СТАВКА</span>
                </div>
                <div id="playersList">
                    <div class="empty-players">
                        нет активных игроков
                    </div>
                </div>
            </div>

            <!-- Ставка -->
            <div class="stake-panel">
                <div class="stake-label">ВАША СТАВКА</div>
                <div class="stake-input-wrapper">
                    <input type="number" id="betAmount" class="stake-input" value="1" min="1" step="1" placeholder="0">
                    <span class="stake-currency">TON</span>
                </div>
                
                <div class="stake-presets">
                    <div class="stake-preset" onclick="setBet(10)">10</div>
                    <div class="stake-preset" onclick="setBet(50)">50</div>
                    <div class="stake-preset" onclick="setBet(100)">100</div>
                    <div class="stake-preset" onclick="setBet(500)">500</div>
                </div>

                <button class="stake-button" onclick="placeBet()" id="placeBetBtn">
                    ПОСТАВИТЬ
                </button>
            </div>
        </div>

        <!-- Секция Профиль -->
        <div id="profileSection" class="section">
            <div class="profile-card">
                <div class="profile-name" id="profileName">@klrpl</div>
                
                <div class="profile-row">
                    <span class="profile-label">Баланс</span>
                    <span class="profile-value" id="profileBalance">1000 TON</span>
                </div>
                
                <div class="profile-row">
                    <span class="profile-label">Побед</span>
                    <span class="profile-value" id="winsCount">0</span>
                </div>
                
                <div class="profile-row">
                    <span class="profile-label">Игр</span>
                    <span class="profile-value" id="gamesCount">0</span>
                </div>

                <div style="margin-top: 30px;">
                    <div class="players-header" style="margin-bottom: 15px;">ИСТОРИЯ</div>
                    <div id="profileHistory">
                        <div class="empty-players">нет истории</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Нижнее меню -->
    <div class="bottom-menu">
        <div class="menu-item active" onclick="showSection('roulette')">РУЛЕТКА</div>
        <div class="menu-item" onclick="showSection('profile')">ПРОФИЛЬ</div>
    </div>

    <script>
        // Telegram WebApp
        let tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Время
        function updateTime() {
            let now = new Date();
            let hours = now.getHours().toString().padStart(2, '0');
            let minutes = now.getMinutes().toString().padStart(2, '0');
            document.getElementById('currentTime').textContent = `${hours}:${minutes}`;
        }
        updateTime();
        setInterval(updateTime, 1000);

        // Данные
        let balance = 1000;
        let wins = 0;
        let games = 0;
        let players = [];
        let history = [];
        let currentUser = '@klrpl';

        let user = tg.initDataUnsafe?.user;
        if (user) {
            currentUser = '@' + (user.username || user.first_name || 'klrpl');
        }

        document.getElementById('profileName').textContent = currentUser;
        updateBalance();

        function updateBalance() {
            document.getElementById('profileBalance').textContent = balance + ' TON';
            document.getElementById('winsCount').textContent = wins;
            document.getElementById('gamesCount').textContent = games;
        }

        function setBet(amount) {
            document.getElementById('betAmount').value = amount;
        }

        function placeBet() {
            let bet = parseInt(document.getElementById('betAmount').value);
            
            if (bet > balance) {
                tg.showPopup({
                    title: 'Ошибка',
                    message: 'Недостаточно средств',
                    buttons: [{type: 'ok'}]
                });
                return;
            }

            // Проверяем, есть ли уже игрок
            let existingPlayer = players.find(p => p.name === currentUser);
            if (existingPlayer) {
                tg.showPopup({
                    title: 'Ошибка',
                    message: 'Вы уже сделали ставку',
                    buttons: [{type: 'ok'}]
                });
                return;
            }

            // Цвет игрока
            let colors = ['red', 'blue', 'yellow'];
            let color = colors[players.length % 3];

            players.push({
                name: currentUser,
                bet: bet,
                color: color
            });

            balance -= bet;
            updateBalance();
            updatePlayersList();
            updateTotalBet();
            
            document.getElementById('wheel').classList.add('has-players');
            tg.HapticFeedback.impactOccurred('medium');
        }

        function updatePlayersList() {
            let list = document.getElementById('playersList');
            
            if (players.length === 0) {
                list.innerHTML = '<div class="empty-players">нет активных игроков</div>';
                document.getElementById('wheel').classList.remove('has-players');
                return;
            }

            let html = '';
            players.forEach(p => {
                html += `
                    <div class="player-item">
                        <div class="player-left">
                            <div class="player-dot dot-${p.color}"></div>
                            <span class="player-name">${p.name}</span>
                        </div>
                        <span class="player-bet">${p.bet} <span>TON</span></span>
                    </div>
                `;
            });

            list.innerHTML = html;
        }

        function updateTotalBet() {
            let total = players.reduce((sum, p) => sum + p.bet, 0);
            document.getElementById('totalBet').innerHTML = total + ' <span>TON</span>';
        }

        // Переключение секций
        function showSection(section) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById(section + 'Section').classList.add('active');
            
            document.querySelectorAll('.menu-item').forEach(item => item.classList.remove('active'));
            event.currentTarget.classList.add('active');
        }
    </script>
</body>
</html>
