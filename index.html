<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PvP Рулетка</title>
    <style>
        body {
            background: #0a0f1a;
            color: white;
            font-family: Arial, sans-serif;
            padding: 15px;
            margin: 0;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1a1f2f;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        
        .balance {
            background: rgba(255,215,0,0.2);
            padding: 6px 15px;
            border-radius: 20px;
            color: gold;
            font-weight: bold;
        }
        
        .roulette-container {
            background: #1a2a3a;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        /* Колесо */
        .wheel {
            width: 280px;
            height: 280px;
            margin: 0 auto 20px;
            position: relative;
        }
        
        .wheel-svg {
            width: 100%;
            height: 100%;
            transform: rotate(0deg);
            transition: transform 3s ease-out;
        }
        
        .wheel-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50px;
            height: 50px;
            background: gold;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: black;
            font-weight: bold;
            z-index: 10;
        }
        
        /* Ставки */
        .bets-panel {
            display: flex;
            gap: 10px;
            margin: 15px 0;
        }
        
        .bet-input {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #45aaf2;
            background: #1f2a3a;
            color: white;
        }
        
        .players-bets {
            margin: 20px 0;
        }
        
        .player-bet-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            margin-bottom: 8px;
        }
        
        .player-info {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .player-avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff6b6b, #4ecdc4);
        }
        
        .bet-bar {
            height: 8px;
            background: #2a3a4a;
            border-radius: 4px;
            margin: 8px 0;
        }
        
        .bet-progress {
            height: 8px;
            background: #45aaf2;
            border-radius: 4px;
            width: 0%;
        }
        
        .spin-btn {
            background: gold;
            color: #0a0f1a;
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-weight: bold;
            width: 100%;
            margin: 10px 0;
            cursor: pointer;
        }
        
        .result {
            text-align: center;
            padding: 15px;
            background: #1f2a3a;
            border-radius: 10px;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="header">
        <span>👤 @klrpl</span>
        <span class="balance" id="balance">0 TON</span>
    </div>
    
    <div class="roulette-container">
        <!-- Колесо -->
        <div class="wheel">
            <svg class="wheel-svg" id="wheel" viewBox="0 0 100 100">
                <!-- Сектора будут добавляться через JS -->
            </svg>
            <div class="wheel-center">🎯</div>
        </div>
        
        <!-- Ставка -->
        <div class="bets-panel">
            <input type="number" id="betAmount" class="bet-input" value="1" min="0.1" step="0.1">
            <button onclick="makeBet()" style="padding: 12px 20px; background: #45aaf2; border: none; border-radius: 8px; color: white;">СТАВКА</button>
        </div>
        
        <!-- Игроки -->
        <div class="players-bets" id="playersList">
            <div class="player-bet-row">
                <div class="player-info">
                    <div class="player-avatar"></div>
                    <div>
                        <div>@ds_ersh</div>
                        <div style="font-size: 12px; color: #888;">14 TON</div>
                    </div>
                </div>
                <span style="color: #45aaf2;">26%</span>
            </div>
            
            <div class="bet-bar">
                <div class="bet-progress" style="width: 26%;"></div>
            </div>
            
            <div class="player-bet-row">
                <div class="player-info">
                    <div class="player-avatar"></div>
                    <div>
                        <div>@giftg...</div>
                        <div style="font-size: 12px; color: #888;">48603 TON</div>
                    </div>
                </div>
                <span style="color: #45aaf2;">82%</span>
            </div>
            
            <div class="bet-bar">
                <div class="bet-progress" style="width: 82%; background: #f44336;"></div>
            </div>
        </div>
        
        <!-- Кнопка крутить -->
        <button class="spin-btn" onclick="spinWheel()">🎲 КРУТИТЬ КОЛЕСО</button>
        
        <!-- Результат -->
        <div class="result" id="result">
            ⏳ Ожидание ставок...
        </div>
    </div>
    
    <script>
        let balance = 100;
        let players = [
            {name: '@ds_ersh', bet: 14, chance: 26},
            {name: '@giftg...', bet: 48603, chance: 82}
        ];
        
        function makeBet() {
            let bet = parseFloat(document.getElementById('betAmount').value);
            
            if(bet > balance) {
                alert('Недостаточно средств!');
                return;
            }
            
            // Добавляем игрока
            let total = players.reduce((sum, p) => sum + p.bet, 0) + bet;
            
            players.push({
                name: '@klrpl',
                bet: bet,
                chance: Math.round((bet / total) * 100)
            });
            
            updateDisplay();
        }
        
        function spinWheel() {
            if(players.length === 0) {
                alert('Сначала сделайте ставку!');
                return;
            }
            
            // Выбираем победителя
            let random = Math.random() * 100;
            let current = 0;
            let winner = null;
            
            for(let player of players) {
                current += player.chance;
                if(random <= current) {
                    winner = player;
                    break;
                }
            }
            
            // Анимация
            let wheel = document.getElementById('wheel');
            let spins = 5 + Math.random() * 5;
            let degrees = spins * 360 + Math.random() * 360;
            wheel.style.transform = `rotate(${degrees}deg)`;
            
            // Результат
            setTimeout(() => {
                document.getElementById('result').innerHTML = `
                    🎉 ПОБЕДИТЕЛЬ: ${winner.name}<br>
                    Выигрыш: ${winner.bet} TON
                `;
            }, 3000);
        }
        
        function updateDisplay() {
            let list = document.getElementById('playersList');
            list.innerHTML = '';
            
            players.forEach(p => {
                list.innerHTML += `
                    <div class="player-bet-row">
                        <div class="player-info">
                            <div class="player-avatar"></div>
                            <div>
                                <div>${p.name}</div>
                                <div style="font-size: 12px; color: #888;">${p.bet} TON</div>
                            </div>
                        </div>
                        <span style="color: #45aaf2;">${p.chance}%</span>
                    </div>
                    <div class="bet-bar">
                        <div class="bet-progress" style="width: ${p.chance}%; background: ${p.name === '@giftg...' ? '#f44336' : '#45aaf2'};"></div>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
